all:
  children:
    proxmox:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          proxmox_user: root@pam
          proxmox_host: localhost
          proxmox_password: "{{ vault_proxmox_password | default('') }}"
          
    k3s_cluster:
      children:
        k3s_master:
          hosts:
            k3s-master-01:
              ansible_host: "{{ hostvars['localhost']['k3s_master_ip'] | default('') }}"
              k3s_role: master
              vmid: 101
        
        k3s_workers:
          hosts:
            k3s-worker-01:
              ansible_host: "{{ hostvars['localhost']['k3s_worker_01_ip'] | default('') }}"
              k3s_role: worker
              vmid: 102
            k3s-worker-02:
              ansible_host: "{{ hostvars['localhost']['k3s_worker_02_ip'] | default('') }}"
              k3s_role: worker
              vmid: 103
            k3s-worker-03:
              ansible_host: "{{ hostvars['localhost']['k3s_worker_03_ip'] | default('') }}"
              k3s_role: worker
              vmid: 104

  vars:
    # 共用配置
    template_id: 9000
    storage: "local-lvm"
    bridge: "vmbr0"
    
    # VM 規格
    master_cpu: 4
    master_memory: 8192
    master_disk: 32
    
    worker_cpu: 2
    worker_memory: 4096
    worker_disk: 32
    
    # 網路配置
    dns_servers:
      - "8.8.8.8"
      - "1.1.1.1"
    
    # ELK 配置
    elasticsearch_version: "8.11.0"
    kibana_version: "8.11.0"
    logstash_version: "8.11.0"
    beats_version: "8.11.0"
    
    # K3s 配置
    k3s_version: "latest"
    k3s_token: "{{ vault_k3s_token | default('super-secret-token-123') }}"
